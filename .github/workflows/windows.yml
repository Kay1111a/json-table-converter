name: Windows desktop app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build portable Windows app
        run: python -m PyInstaller --noconfirm --onefile --windowed --name JsonTableConverter desktop.py
      - name: Check that the packaged app launches
        shell: pwsh
        run: |
          $app = Start-Process -FilePath ./dist/JsonTableConverter.exe -ArgumentList "--smoke-test" -PassThru
          if (!$app.WaitForExit(30000)) {
            taskkill /PID $app.Id /T /F
            throw "The packaged app did not complete its startup check."
          }
          if ($app.ExitCode -ne 0) {
            throw "The packaged app failed its startup check (exit code $($app.ExitCode))."
          }
      - uses: actions/upload-artifact@v7
        with:
          name: JsonTableConverter-Windows-x64
          path: dist/JsonTableConverter.exe
          if-no-files-found: error
